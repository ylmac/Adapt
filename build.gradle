plugins {
    id 'net.fabricmc.fabric-loom' version "1.17.14"
    id 'maven-publish'
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    id 'org.jetbrains.kotlin.plugin.compose' version "${kotlin_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url = file('libs/maven') }
    maven { url "https://maven.aliyun.com/repository/public" }
    maven { url "https://maven.aliyun.com/repository/central" }
    maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
    mavenCentral()
    google()
    maven { url "https://dl.google.com/dl/android/maven2/" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://repo.polyfrost.org/releases" }
    maven { url "https://maven.pkg.jetbrains.space/public/p/compose/dev" }
}

// Compose 编译 classpath：从已解析的 compose-bundle 解出嵌套 jar（与运行时同源），
// 避免再拉一套 JetBrains/AndroidX 坐标踩不到 alpha 构件。
configurations {
    composeBundleResolve {
        transitive = false
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    composeBundleResolve("org.polyfrost.oneconfig:compose-bundle:${project.compose_bundle_version}")
}

def composeCompileLibs = layout.buildDirectory.dir("compose-compile-libs")

tasks.register("extractComposeCompileLibs", Copy) {
    from({
        def bundle = configurations.composeBundleResolve.files.find {
            it.name.startsWith("compose-bundle")
        } ?: configurations.composeBundleResolve.singleFile
        zipTree(bundle).matching {
            include "META-INF/jars/*.jar"
        }
    })
    into(composeCompileLibs)
    includeEmptyDirs = false
    eachFile { fcd ->
        fcd.path = fcd.name // flatten META-INF/jars/foo.jar → foo.jar
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Sodium only supplies compile-time types for the two Sodium-specific mixins;
    // the game instance provides the actual mod at runtime.
    compileOnly files('libs/sodium-fabric-0.9.1-beta.2+mc26.2.jar')

    // Kotlin + Compose runtime (JiJ so players need not install them separately).
    // This project historically uses include(implementation(...)) — Loom here has no
    // modImplementation helper in the Groovy DSL evaluation path we hit.
    include implementation("net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}")
    include implementation("org.polyfrost.oneconfig:compose-bundle:${project.compose_bundle_version}")

    implementation("org.ow2.asm:asm:9.7")
    include implementation("io.github.humbleui:types:0.2.0")
    include implementation("io.github.humbleui:skija-shared:${project.skija_version}")
    // 多平台 skija native：macOS arm64（本机）+ Windows x64（用户要求支持 Windows）
    include implementation("io.github.humbleui:skija-macos-arm64:${project.skija_version}")
    include implementation("io.github.humbleui:skija-windows-x64:${project.skija_version}")

    // 游戏自己带 gson，只用来编译，不再塞进模组包。
    implementation("com.google.code.gson:gson:2.10.1")
    include implementation("net.jthink:jaudiotagger:3.0.1")
    include implementation("com.googlecode.soundlibs:jlayer:1.0.1.4")
    include implementation("org.jflac:jflac-codec:1.5.2")
    include implementation("com.google.zxing:core:3.5.3")
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "adaptclient" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    mixin {
        add sourceSets.client, "adapt.refmap.json"
    }
}

// Compose APIs only needed to compile client Kotlin UI (runtime = compose-bundle JiJ).
def composeJarTree = fileTree(composeCompileLibs) {
    include "*.jar"
    builtBy tasks.named("extractComposeCompileLibs")
}
afterEvaluate {
    sourceSets.client.compileClasspath += composeJarTree
    sourceSets.client.runtimeClasspath += composeJarTree
    tasks.named("compileClientKotlin", org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configure { t ->
        t.dependsOn(tasks.named("extractComposeCompileLibs"))
        // Directory Provider 不会自动把子 jar 加进 classpath；用 fileTree。
        t.libraries.from(composeJarTree)
        // 兼容部分 KGP：同步进任务 classpath（若属性存在）
        try {
            t.classpath += composeJarTree
        } catch (Throwable ignored) {
        }
    }
    tasks.named("compileClientJava").configure {
        dependsOn(tasks.named("extractComposeCompileLibs"))
        classpath += composeJarTree
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

kotlin {
    jvmToolchain(Integer.parseInt(project.java_version))
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(project.java_version))
        freeCompilerArgs.addAll([
                '-opt-in=androidx.compose.material.ExperimentalMaterialApi',
                '-opt-in=androidx.compose.ui.ExperimentalComposeUiApi',
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(project.java_version)
    options.compilerArgs.addAll(['--add-opens', 'java.base/java.lang=ALL-UNNAMED'])
    options.compilerArgs.addAll(['--add-opens', 'java.base/jdk.internal.loader=ALL-UNNAMED'])
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
